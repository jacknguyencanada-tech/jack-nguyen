<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jack Nguyen | Operations, Supply Chain, Logistics & Manufacturing Portfolio</title>
  <meta
    name="description"
    content="Recruiter-friendly professional portfolio for Jack Nguyen, a Toronto-based operations, supply chain, logistics, and manufacturing professional with experience across shipping, freight coordination, customs documentation exposure, and CNC fabrication."
  >
  <meta
    name="keywords"
    content="Jack Nguyen, Toronto, supply chain, operations, logistics, freight, customs documentation, manufacturing, CNC, procurement"
  >
  <meta name="theme-color" content="#f4ecdf">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Bricolage+Grotesque:wght@600;700;800&display=swap"
    rel="stylesheet"
  >
  <style>
:root {
  --bg: #f4ecdf;
  --bg-soft: #efe5d6;
  --panel: rgba(255, 251, 245, 0.78);
  --panel-strong: rgba(255, 248, 238, 0.94);
  --text: #1f1a17;
  --muted: #62584f;
  --line: rgba(31, 26, 23, 0.1);
  --accent: #d0653f;
  --accent-deep: #9a4127;
  --accent-cool: #385de4;
  --shadow: 0 22px 50px rgba(63, 38, 20, 0.1);
  --radius-xl: 34px;
  --radius-lg: 24px;
  --radius-md: 18px;
  --content: min(1180px, calc(100vw - 36px));
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  color: var(--text);
  font-family: "Manrope", sans-serif;
  background:
    radial-gradient(circle at top right, rgba(56, 93, 228, 0.12), transparent 22%),
    radial-gradient(circle at 15% 15%, rgba(208, 101, 63, 0.12), transparent 20%),
    linear-gradient(180deg, #f7f0e5 0%, #f3e9dc 100%);
  overflow-x: hidden;
}

a {
  color: inherit;
  text-decoration: none;
}

.skip-link {
  position: absolute;
  left: 12px;
  top: -40px;
  z-index: 200;
  padding: 10px 14px;
  background: var(--text);
  color: #fff;
  border-radius: 999px;
}

.skip-link:focus {
  top: 12px;
}

.noise {
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: 0.08;
  background-image:
    linear-gradient(rgba(0, 0, 0, 0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 0, 0, 0.02) 1px, transparent 1px);
  background-size: 14px 14px;
}

.cursor-aura {
  position: fixed;
  top: 0;
  left: 0;
  width: 280px;
  height: 280px;
  margin-left: -140px;
  margin-top: -140px;
  border-radius: 50%;
  pointer-events: none;
  opacity: 0.28;
  background: radial-gradient(circle, rgba(208, 101, 63, 0.25), rgba(208, 101, 63, 0));
  mix-blend-mode: multiply;
  z-index: 0;
}

.site-header {
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(14px);
}

.header-shell,
.hero,
.section,
.resume-banner,
.site-footer {
  width: var(--content);
  margin: 0 auto;
}

.header-shell {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 24px 0 16px;
}

.site-brand {
  font-family: "Bricolage Grotesque", sans-serif;
  font-size: 1.2rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.site-nav {
  display: flex;
  gap: 22px;
  color: var(--muted);
  font-size: 0.94rem;
}

.site-nav a:hover {
  color: var(--text);
}

.hero {
  min-height: calc(100vh - 86px);
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) minmax(340px, 0.85fr);
  gap: 40px;
  align-items: start;
  padding: 34px 0 54px;
}

.section {
  padding: 58px 0 24px;
}

.section-toned {
  position: relative;
}

.section-toned::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 22px;
  transform: translateX(-50%);
  width: var(--content);
  height: calc(100% - 44px);
  border-radius: var(--radius-xl);
  background: rgba(255, 249, 241, 0.5);
  border: 1px solid rgba(31, 26, 23, 0.06);
  z-index: -1;
}

.section-kicker {
  margin: 0 0 14px;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 0.18em;
  font-size: 0.78rem;
  font-weight: 800;
}

.hero-copy h1,
.section-heading h2,
.resume-banner h2,
.hero-card h2 {
  margin: 0;
  font-family: "Bricolage Grotesque", sans-serif;
  line-height: 0.96;
}

.hero-copy h1 {
  font-size: clamp(3.1rem, 6.4vw, 5.9rem);
  max-width: 11ch;
}
